<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <meta name="apple-mobile-web-app-capable" content="yes"> <title>Food Matching Game</title> <style> body { font-family: Arial, sans-serif; background-color: #f5f5f5; display: flex; flex-direction: column; align-items: center; padding: 20px; } h2 { margin-bottom: 5px; } #score { margin-top: 5px; color: #27ae60; } .controls { margin: 15px 0; } .btn { background-color: #27ae60; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; } .btn:hover { background-color: #219653; } /* RESPONSIVE GRID */ #game { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 500px; } .card { width: 100%; aspect-ratio: 1 / 1; perspective: 1000px; } .inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s; transform-style: preserve-3d; border-radius: 8px; } .card.flipped .inner { transform: rotateY(180deg); } .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; overflow: hidden; } .back { background: #2c3e50; display: flex; align-items: center; justify-content: center; color: white; } .front { transform: rotateY(180deg); } img { width: 100%; height: 100%; object-fit: cover; } .card.matched .inner { opacity: 0.6; box-shadow: 0 0 15px #27ae60; } /* Plate */ #plate { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; } .plate-item img { width: 50px; height: 50px; border-radius: 50%; } /* Win screen */ #win-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; } .win-box { background: white; padding: 30px; border-radius: 10px; text-align: center; } </style> </head> <body> <h2>Food Matching Game</h2> <h3 id="score">Score: 0</h3> <div class="controls"> <button class="btn" onclick="initGame()">Restart</button> </div> <div id="game"></div> <h3>Your Plate</h3> <div id="plate"></div> <div id="win-overlay"> <div class="win-box"> <h1>🎉 You Win! 🎉</h1> <button class="btn" onclick="initGame()">Play Again</button> </div> </div> <script> const foods = [ {name:"Fried Chicken", img:"images/fried_chicken.jpg"}, {name:"Curry Chicken", img:"images/curry_chicken.jpg"}, {name:"BBQ Chicken", img:"images/bbq_chicken.jpg"}, {name:"Chicken Nuggets", img:"images/chicken_nuggets.jpg"}, {name:"Mac & Cheese", img:"images/mac_cheese.jpg"}, {name:"Cornbread", img:"images/cornbread.jpg"}, {name:"Collard Greens", img:"images/collard_greens.jpg"}, {name:"Banana Pudding", img:"images/banana_pudding.jpg"} ]; const game = document.getElementById("game"); const plate = document.getElementById("plate"); const scoreDisplay = document.getElementById("score"); const winOverlay = document.getElementById("win-overlay"); let first = null; let second = null; let lock = false; let matchCount = 0; let score = 0; function initGame() { game.innerHTML = ""; plate.innerHTML = ""; winOverlay.style.display = "none"; first = null; second = null; lock = false; matchCount = 0; score = 0; scoreDisplay.innerText = "Score: 0"; let cards = [...foods, ...foods].sort(() => Math.random() - 0.5); cards.forEach(item => { const card = document.createElement("div"); card.className = "card"; card.innerHTML = <div class="inner"> <div class="front"> <img src="${item.img}"> </div> <div class="back">?</div> </div> ; card.addEventListener("click", () => { if (lock || card.classList.contains("flipped") || card.classList.contains("matched")) return; card.classList.add("flipped"); if (!first) { first = {card, item}; return; } second = {card, item}; lock = true; if (first.item.name === second.item.name) { first.card.classList.add("matched"); second.card.classList.add("matched"); // Plate add const plateItem = document.createElement("div"); plateItem.className = "plate-item"; plateItem.innerHTML = <img src="${item.img}">; plate.appendChild(plateItem); score += 10; scoreDisplay.innerText = "Score: " + score; matchCount++; if (matchCount === foods.length) { setTimeout(() => { winOverlay.style.display = "flex"; }, 400); } reset(); } else { score -= 2; scoreDisplay.innerText = "Score: " + score; setTimeout(() => { first.card.classList.remove("flipped"); second.card.classList.remove("flipped"); reset(); }, 700); } }); game.appendChild(card); }); } function reset() { first = null; second = null; lock = false; } initGame(); </script> </body> </html>
